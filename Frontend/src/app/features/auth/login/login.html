<div class="login-container">
    <div class="login-wrapper">

        <!-- Logo flotante -->
        <a href="/auth/login" class="logo-link">
            <img src="/assets/madraza-vector.svg" alt="Logo de Madraza" class="logo-img" />
        </a>

        <!-- Tarjeta del formulario -->
        <div class="login-card">

            <p class="subtitulo">Introduce tus credenciales para iniciar sesión</p>

            @if (errorMessage) {
            <div class="error-banner">
                <span>{{ errorMessage }}</span>
            </div>
            }

            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Email</mat-label>
                <input matInput type="email" [(ngModel)]="email" placeholder="tu@email.com" (keyup.enter)="login()" />
                <mat-icon matSuffix>email</mat-icon>
            </mat-form-field>

            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Contraseña</mat-label>
                <input matInput [type]="mostrarPassword ? 'text' : 'password'" [(ngModel)]="password"
                    (keyup.enter)="login()" />
                <mat-icon matSuffix style="cursor:pointer" (click)="mostrarPassword = !mostrarPassword">
                    {{ mostrarPassword ? 'visibility_off' : 'visibility' }}
                </mat-icon>
            </mat-form-field>

            <button mat-flat-button class="btn-login" (click)="login()" [disabled]="cargando">
                @if (cargando) {
                <mat-spinner diameter="20"></mat-spinner>
                } @else {
                Iniciar sesión
                }
            </button>

            <!-- Separador -->
            <div class="separador">
                <span>o continúa con</span>
            </div>
            
            <!-- Botones OAuth2 -->
            <a href="http://localhost:8080/oauth2/authorize/google" class="oauth-btn oauth-google">
                <img src="/assets/icons/google.svg" alt="Iniciar sesión con Google" width="20" height="20" />
                <span>Google</span>
            </a>
            <a href="http://localhost:8080/oauth2/authorize/github" class="oauth-btn oauth-github">
                <img src="/assets/icons/github.svg" alt="Iniciar sesión con GitHub" width="20" height="20" />
                <span>GitHub</span>
            </a>

            <p class="registro-link">
                ¿No tienes cuenta?
                <a routerLink="/auth/registro">Regístrate gratis</a>
            </p>

        </div>
    </div>
</div>
