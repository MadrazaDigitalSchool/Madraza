<div class="login-container">
    <div class="login-wrapper">

        <!-- Logo flotante -->
        <a href="/auth/login" class="logo-link">
            <img src="/assets/madraza-vector.svg" alt="Logo de Madraza" class="logo-img" />
        </a>

        <!-- Tarjeta del formulario -->
        <div class="login-card">

            <p class="subtitulo">Introduce los datos de tu cuenta para iniciar sesión</p>

            @if (errorMessage) {
            <div class="error-banner">
                <span>{{ errorMessage }}</span>
            </div>
            }

            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Email</mat-label>
                <input matInput type="email" [(ngModel)]="email" placeholder="tu@email.com" (keyup.enter)="login()" />
                <mat-icon matSuffix>email</mat-icon>
            </mat-form-field>

            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Contraseña</mat-label>
                <input matInput [type]="mostrarPassword ? 'text' : 'password'" [(ngModel)]="password"
                    (keyup.enter)="login()" />
                <mat-icon matSuffix style="cursor:pointer" (click)="mostrarPassword = !mostrarPassword">
                    {{ mostrarPassword ? 'visibility_off' : 'visibility' }}
                </mat-icon>
            </mat-form-field>

            <div class="form-extra">
                <mat-checkbox [(ngModel)]="recordarme" color="primary">Recordarme</mat-checkbox>
                <a routerLink="/auth/recuperar-password" class="forgot-link">¿Olvidaste la contraseña?</a>
            </div>

            <button mat-flat-button class="btn-login" (click)="login()" [disabled]="cargando">
                @if (cargando) {
                <mat-spinner diameter="20"></mat-spinner>
                } @else {
                Iniciar sesión
                }
            </button>

            <!-- Separador -->
            <div class="separador">
                <span>o continúa con</span>
            </div>
            
            <!-- Botones OAuth2 -->
            <div class="oauth-buttons">
                <a [href]="googleOAuthUrl" class="oauth-btn" aria-label="Iniciar sesión con Google">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path
                            d="M12.545 10.239v3.821h5.445c-.712 2.315-2.647 3.972-5.445 3.972a6.033 6.033 0 1 1 0-12.064c1.498 0 2.866.549 3.921 1.453l2.814-2.814A9.969 9.969 0 0 0 12.545 2C7.021 2 2.543 6.477 2.543 12s4.478 10 10.002 10c8.396 0 10.249-7.85 9.426-11.748z" />
                    </svg>
                    <span>Google</span>
                </a>
                <a [href]="githubOAuthUrl" class="oauth-btn" aria-label="Iniciar sesión con GitHub">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path
                            d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.008-.866-.013-1.7-2.782.603-3.369-1.342-3.369-1.342-.454-1.155-1.11-1.462-1.11-1.462-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0 1 12 6.836a9.59 9.59 0 0 1 2.504.337c1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.202 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.578.688.48C19.138 20.163 22 16.418 22 12c0-5.523-4.477-10-10-10z" />
                    </svg>
                    <span>GitHub</span>
                </a>
            </div>

            <!-- Enlace a registro -->
            <p class="registro-link">
                ¿No tienes cuenta? <a routerLink="/auth/registro">Regístrate</a>
            </p>

        </div>
    </div>
</div>
