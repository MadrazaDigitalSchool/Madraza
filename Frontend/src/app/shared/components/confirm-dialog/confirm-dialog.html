<h2 mat-dialog-title class="dialog-titulo">
  <mat-icon class="dialog-icono">warning</mat-icon>
  {{ data.titulo }}
</h2>

<mat-dialog-content>
  <p class="dialog-mensaje">{{ data.mensaje }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button [mat-dialog-close]="false">
    {{ data.labelCancelar || 'Cancelar' }}
  </button>
  <button mat-flat-button color="warn" [mat-dialog-close]="true" cdkFocusInitial>
    {{ data.labelConfirmar || 'Confirmar' }}
  </button>
</mat-dialog-actions>
