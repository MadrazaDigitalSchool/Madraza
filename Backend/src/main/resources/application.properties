# ── APLICACIÓN ────────────────────────────────────────────────────────────────
spring.application.name=madraza

# Perfil activo por defecto (sobreescribir con -Dspring.profiles.active=prod en producción)
spring.profiles.active=dev

# ── JPA / HIBERNATE (compartido) ──────────────────────────────────────────────
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ── MAIL SMTP (compartido) ────────────────────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ── TIMEOUTS (compartido) ─────────────────────────────────────────────────────
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.max-lifetime=1800000

# Los valores sensibles (claves, credenciales, URLs de BD) se configuran en:
#   - application-dev.properties  → desarrollo local
#   - application-prod.properties → producción (variables de entorno)
