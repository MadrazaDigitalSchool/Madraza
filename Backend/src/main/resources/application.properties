# ── APLICACIÓN ────────────────────────────────────────────────────────────────
spring.application.name=madraza

# Perfil activo por defecto (sobreescribir con -Dspring.profiles.active=prod en producción)
spring.profiles.active=dev

# ── JPA / HIBERNATE (compartido) ──────────────────────────────────────────────
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ── TIMEOUTS (compartido) ─────────────────────────────────────────────────────
spring.datasource.hikari.connection-timeout=15000
app.jwt.expiration-ms=86400000
spring.datasource.hikari.max-lifetime=1800000

# ── OAUTH2 (compartido) ───────────────────────────────────────────────────────
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth?prompt=select_account

# Los valores sensibles (claves, credenciales, URLs de BD) se configuran en:
#   - application-dev.properties  → desarrollo local
#   - application-prod.properties → producción (variables de entorno)
