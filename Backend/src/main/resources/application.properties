# ── NOMBRE DE LA APP ───────────────────────────────────
spring.application.name=Backend

# ── SERVIDOR ──────────────────────────────────────────
server.port=8080

# ── BASE DE DATOS ──────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/madraza?useSSL=false&serverTimezone=Europe/Madrid&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / HIBERNATE ────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ── JWT ────────────────────────────────────────────────
# Clave secreta para firmar los tokens (mínimo 256 bits)
app.jwt.secret=TWlDbGF2ZVNlY3JldGFTdXBlclNlZ3VyYVBhcmFNYWRyYXphMjAyNlByb2plY3RvSW50ZWdyYWRvREFX
# Tiempo de expiración del token: 24 horas en milisegundos
app.jwt.expiration-ms=86400000