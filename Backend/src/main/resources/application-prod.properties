# ── SERVIDOR ──────────────────────────────────────────────────────────────────
server.port=${PORT:8080}

# ── BASE DE DATOS ─────────────────────────────────────────────────────────────
# Configura las siguientes variables de entorno en el servidor de producción:
# DATABASE_URL, DATABASE_USERNAME, DATABASE_PASSWORD
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / HIBERNATE ───────────────────────────────────────────────────────────
# En producción NO regenerar el schema, solo validar
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── CORS en producción ────────────────────────────────────────────────────────
# ALLOWED_ORIGINS=https://tudominio.com,https://www.tudominio.com
# La variable ALLOWED_ORIGINS es leída en SecurityConfig.corsConfigurationSource()

# ── LOGS ──────────────────────────────────────────────────────────────────────
logging.level.com.madraza=WARN
logging.level.org.springframework.security=WARN
logging.level.root=WARN
