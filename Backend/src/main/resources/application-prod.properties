# SERVIDOR
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# BASE DE DATOS
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT
app.jwt.secret=${JWT_SECRET}

# STRIPE
stripe.api.key=${STRIPE_SECRET_KEY}
stripe.price.mensual=${STRIPE_PRICE_MENSUAL}
stripe.price.anual=${STRIPE_PRICE_ANUAL}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}

# FRONTEND
app.frontend.url=https://madraza.vercel.app
allowed.origins=https://madraza.vercel.app

# GROQ
groq.api.key=${GROQ_API_KEY}

# BREVO
brevo.api.key=${BREVO_API_KEY}
brevo.sender.name=Madraza
brevo.sender.email=madrazaapp@gmail.com
app.mail.contacto=madrazaapp@gmail.com

# OAUTH2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.redirect-uri=https://madraza-production.up.railway.app/login/oauth2/code/google
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.redirect-uri=https://madraza-production.up.railway.app/login/oauth2/code/github

# ADMIN
app.admin.email=${ADMIN_EMAIL:madrazaapp@gmail.com}
app.admin.password=${ADMIN_PASSWORD}

# LOGS
logging.level.com.madraza=WARN
logging.level.org.springframework.security=WARN
logging.level.root=WARN
